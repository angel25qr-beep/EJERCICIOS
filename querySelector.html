<!DOCTYPE html>
<html>
<head>
    <title>Ejemplos querySelector</title>
</head>
<body>

    <h2>Ejemplo 1: Obtener un elemento por clase</h2>

    <p class="destacado">Texto importante</p>

    <script>
        document.querySelector(".destacado").style.color = "red";
    </script>


    <h2>Ejemplo 2: Obtener un botón y deshabilitarlo</h2>

    <button class="btn">Enviar</button>

    <script>
        document.querySelector(".btn").disabled = true;
    </script>

    <br><br>
<a href="index.html" class="btn btn-primary">
    Regresar a Index
</a>

</body>
</html>
