<!DOCTYPE html>
<html>
<head>
    <title>Ejemplos innerHTML</title>
</head>
<body>

    <h2>Ejemplo 1: Cambiar texto</h2>

    <p id="mensaje">Hola mundo</p>

    <script>
        document.getElementById("mensaje").innerHTML =
        "¡Bienvenido!";
    </script>

    <h2>Ejemplo 2: Agregar una imagen</h2>

    <div id="imagen"></div>

    <script>
        document.getElementById("imagen").innerHTML =
        '<img src="Disney.JFIF" alt="Disney" >';
    </script>

    <br><br>
<a href="index.html" class="btn btn-primary">
    Regresar a Index
</a>

</body>
</html>
